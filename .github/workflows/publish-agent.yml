name: Publish agent image

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - tsconfig.build.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish-agent.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Set image tag
        id: image
        run: echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sousa99/home-sweet-home-agent:${{ steps.image.outputs.tag }}

      - name: Record published image
        run: |
          echo "Published ghcr.io/sousa99/home-sweet-home-agent:${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
